<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PET Crossword</title>
<meta name="description" content="PET Part 11 vocabulary crossword for Mr. Waylay's class. Pick a number, solve the word, and open a hint game when you are stuck.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e9eef4;
  --sheet:#ffffff;
  --ink:#1b2a41;
  --ink-soft:#4b5d78;
  --line:#9fb0c4;
  --rule:#cfd9e4;
  --red:#d7263d;
  --red-deep:#a3172a;
  --red-wash:#fde7ea;
  --ok:#1f7a4d;
  --ok-wash:#e2f3ea;
  --warn:#b7791f;
  --hint:#6a7b92;
  --cell:30px;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#0f1a2b;color:var(--ink);font-family:var(--body);font-size:22px;line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

/* 16:9 stage, scaled to fit the window */
.stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;background:var(--paper);overflow:hidden;display:flex;flex-direction:column;padding:36px 56px 32px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:16px;border-bottom:3px solid var(--ink);margin-bottom:28px;flex:none}
.top h1{font-family:var(--display);font-weight:800;font-size:58px;line-height:1;margin:0;letter-spacing:-.02em}
.top h1 small{display:block;font-weight:400;font-size:22px;letter-spacing:0;color:var(--ink-soft);margin-top:8px;font-family:var(--body)}
.progress{font-family:var(--display);font-size:22px;color:var(--ink-soft);display:flex;align-items:center;gap:16px}
.bar{width:220px;height:12px;background:var(--rule);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .4s}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:4px;color:var(--ink-soft);font-size:20px}
.keyhint{font-size:17px;color:var(--ink-soft)}

/* picker slide */
.picker{flex:1;display:grid;grid-template-columns:7fr 5fr;gap:56px;align-content:center;min-height:0}
.picker h2{font-family:var(--display);font-size:40px;font-weight:800;margin:0 0 4px;line-height:1}
.picker p.lead{margin:0 0 22px;color:var(--ink-soft);font-size:21px}
.nums{display:grid;gap:16px}
#numsA{grid-template-columns:repeat(7,1fr)}
#numsD{grid-template-columns:repeat(5,1fr)}
.num{position:relative;aspect-ratio:1;border:3px solid var(--ink);background:var(--sheet);border-radius:6px;font-family:var(--display);font-weight:800;font-size:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:transform .12s,background .12s;padding:0}
.num span{font-family:var(--body);font-weight:400;font-size:16px;color:var(--ink-soft);margin-top:8px}
.num:hover{background:var(--red-wash);transform:translateY(-3px)}
.num.done{background:var(--ink);color:#fff}
.num.done span{color:#c9d4e2}

/* play slide */
.play{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:32px;min-height:0}
.board{background:var(--sheet);border:3px solid var(--ink);border-radius:6px;padding:16px;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(var(--cols),var(--cell));grid-template-rows:repeat(var(--rows),var(--cell));width:max-content}
.cell{position:relative;border:1px solid var(--line);margin:-.5px;background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:calc(var(--cell)*.56);text-transform:uppercase;transition:background .2s,color .2s}
.cell .n{position:absolute;top:1px;left:3px;font-family:var(--body);font-weight:700;font-size:calc(var(--cell)*.3);line-height:1;color:var(--ink-soft)}
.cell.solved{background:#f4f7fa}
.cell.known{color:var(--ink)}
.cell.peek{color:var(--hint);font-weight:600}
.cell.sel{background:var(--red);border-color:var(--red-deep);color:#fff;z-index:1}
.cell.sel .n{color:#fff}
.cell.sel.peek{color:#ffd9de}
.cell.flash{animation:flash .7s}
@keyframes flash{0%{background:var(--ok)}100%{background:#f4f7fa}}
.side{display:flex;flex-direction:column;gap:18px;min-height:0}
.card{background:var(--sheet);border:3px solid var(--ink);border-radius:6px;padding:22px 24px}
#clueCard{flex:1;display:flex;flex-direction:column;min-height:0}
.tag{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;display:flex;align-items:baseline;gap:14px}
.tag em{font-style:normal;font-weight:400;font-size:26px;color:var(--ink-soft)}
.len{align-self:flex-start;margin-top:12px;background:var(--red);color:#fff;font-family:var(--display);font-weight:600;font-size:22px;padding:4px 14px;border-radius:4px}
.clue{font-size:25px;line-height:1.4;margin:16px 0 0;flex:1;overflow:auto}
.answer{display:flex;gap:10px;margin-top:16px}
.answer input{flex:1;min-width:0;border:3px solid var(--ink);border-radius:6px;padding:10px 14px;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.1em;text-transform:uppercase;background:#fff;color:var(--ink)}
.answer input:disabled{background:var(--ok-wash);border-color:var(--ok);color:var(--ok)}
.btn{border:3px solid var(--ink);background:var(--sheet);border-radius:6px;padding:12px 20px;font-family:var(--display);font-weight:600;font-size:22px}
.btn:hover{background:var(--paper)}
.btn.solid{background:var(--ink);color:#fff}
.btn.solid:hover{background:#2c3f5c}
.btn.red{background:var(--red);border-color:var(--red-deep);color:#fff}
.btn.red:hover{background:var(--red-deep)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:12px}
.row .btn{flex:1;font-size:19px;padding:12px 10px}
.msg{min-height:32px;margin-top:10px;font-weight:700;font-size:22px}
.msg.ok{color:var(--ok)}
.msg.bad{color:var(--red)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.hintbox{border-style:dashed;padding:18px 24px}
.hintbox h3{display:none}
.hintbox p{display:none}
.hintbox .btn{width:100%;font-size:28px;padding:14px}
.used{margin-top:8px;font-size:18px;color:var(--ink-soft);min-height:0}
.used:empty{display:none}

/* hint modal, inside the stage */
.veil{position:absolute;inset:0;background:rgba(27,42,65,.6);display:none;align-items:center;justify-content:center;padding:30px;z-index:50}
.veil.open{display:flex}
.modal{background:var(--sheet);border:3px solid var(--ink);border-radius:8px;width:1080px;max-height:850px;overflow:auto;padding:28px 34px 22px;animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.modal h3{font-family:var(--display);font-size:42px;margin:0;line-height:1.05}
.modal .how{color:var(--ink-soft);margin:6px 0 16px;font-size:21px}
.modal .foot{display:flex;gap:12px;justify-content:space-between;margin-top:12px;padding-top:14px;border-top:2px solid var(--rule)}
.gclue{background:var(--paper);padding:12px 18px;border-radius:6px;font-size:21px;margin-bottom:14px}
.big{font-size:34px;line-height:1.4;margin:10px 0}
.big b{font-family:var(--display)}
.blank{display:inline-block;min-width:150px;border-bottom:4px solid var(--red);margin:0 6px}

.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 22px}
.slot{width:58px;height:66px;border:3px solid var(--ink);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:36px;background:#fff;padding:0}
.slot.wide{width:auto;min-width:80px;padding:0 14px}
.slot.empty{border-style:dashed;border-color:var(--line)}
.slot.fill{cursor:pointer}
.slot.miss{color:var(--red)}
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.tile{min-width:62px;height:68px;padding:0 16px;border:3px solid var(--ink);border-bottom-width:7px;border-radius:7px;background:#fff;font-family:var(--display);font-weight:800;font-size:34px}
.tile:hover{background:var(--red-wash)}
.tile.gone{visibility:hidden}
.keys{display:grid;grid-template-columns:repeat(13,1fr);gap:7px;margin-top:8px}
.key{height:54px;border:3px solid var(--ink);border-radius:6px;background:#fff;font-family:var(--display);font-weight:800;font-size:24px;padding:0}
.key.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.key.no{background:var(--rule);border-color:var(--rule);color:var(--hint)}
.key.part{background:var(--warn);border-color:var(--warn);color:#fff}
.key.wide{grid-column:span 2;font-size:19px}
.keys.k15{grid-template-columns:repeat(15,1fr)}
.lives{display:flex;gap:8px;justify-content:center;margin:4px 0 16px}
.lives i{width:44px;height:12px;border-radius:6px;background:var(--red)}
.lives i.lost{background:var(--rule)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.choice{border:3px solid var(--ink);border-radius:6px;background:#fff;padding:26px 12px;font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:.06em}
.choice:hover{background:var(--paper)}
.choice.right{background:var(--ok);border-color:var(--ok);color:#fff}
.choice.wrong{background:var(--rule);border-color:var(--rule);color:var(--hint);text-decoration:line-through}
.wgrid{display:flex;flex-direction:column;gap:5px;align-items:center;margin-bottom:10px}
.wrow{display:flex;gap:5px}
.wc{width:var(--wc,46px);height:var(--wc,46px);border:2px solid var(--rule);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:calc(var(--wc,46px)*.52);background:#fff}
.wc.typed{border-color:var(--ink)}
.wc.g{background:var(--ok);border-color:var(--ok);color:#fff}
.wc.y{background:var(--warn);border-color:var(--warn);color:#fff}
.wc.x{background:var(--hint);border-color:var(--hint);color:#fff}
.legend{font-size:19px;color:var(--ink-soft);text-align:center;margin-bottom:6px}
.legend b{padding:0 8px;border-radius:4px;color:#fff;font-weight:400}
.status{text-align:center;font-weight:700;font-size:24px;min-height:34px;margin-top:8px}
.status.ok{color:var(--ok)}
.status.bad{color:var(--red)}
.win{background:var(--ok-wash);border:3px solid var(--ok);border-radius:6px;padding:16px;text-align:center;margin-top:14px;font-size:24px}
.win b{display:block;font-family:var(--display);font-size:46px;letter-spacing:.1em;color:var(--ok)}

/* finished slide */
.done-all{position:absolute;inset:0;background:var(--ink);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:40;gap:28px}
.done-all.show{display:flex}
.done-all h2{font-family:var(--display);font-weight:800;font-size:110px;line-height:1;margin:0;letter-spacing:-.02em}
.done-all p{font-size:32px;margin:0;color:#c9d4e2}
.done-all .btn{background:transparent;color:#fff;border-color:#fff;font-size:24px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <header class="top">
    <h1>PET Crossword<small id="subtitle">Part 11, Mr. Waylay's English class</small></h1>
    <div class="progress"><span class="keyhint">F full screen</span><span id="progText">0 / 23 words</span><div class="bar"><i id="progBar"></i></div><button class="linkbtn" id="resetAll">Start over</button></div>
  </header>

  <!-- PICKER SLIDE -->
  <section id="pickerView" class="picker">
    <div>
      <h2>Across</h2>
      <p class="lead">Words that read left to right</p>
      <div class="nums" id="numsA"></div>
    </div>
    <div>
      <h2>Down</h2>
      <p class="lead">Words that read top to bottom</p>
      <div class="nums" id="numsD"></div>
    </div>
  </section>

  <!-- PLAY SLIDE -->
  <section id="playView" class="play" hidden>
    <div class="board" id="board"><div class="grid" id="grid"></div></div>
    <aside class="side">
      <div class="card" id="clueCard">
        <div class="tag"><span id="cNum">2</span><em id="cDir">Across</em></div>
        <span class="len" id="cLen">6 letters</span>
        <p class="clue" id="cClue"></p>
        <form class="answer" id="ansForm" autocomplete="off">
          <input id="ansInput" aria-label="Your answer" spellcheck="false" autocapitalize="characters">
          <button class="btn solid" type="submit">Check</button>
        </form>
        <div class="msg" id="msg"></div>
      </div>
      <div class="card hintbox" id="hintCard">
        <h3>Stuck?</h3>
        <p>Each time you press it, you get a random hint game.</p>
        <button class="btn red" id="hintBtn">Hint</button>
        <div class="used" id="usedHints"></div>
      </div>
      <div class="row">
        <button class="btn" id="backBtn">Pick another number</button>
        <button class="btn" id="revealBtn">Show answer</button>
      </div>
    </aside>
  </section>

  <!-- FINISHED SLIDE -->
  <div class="done-all" id="doneAll">
    <h2>Crossword complete</h2>
    <p>All 23 words solved. Well done, everyone!</p>
    <button class="btn" id="doneBack">Back to the numbers</button>
  </div>

  <div class="veil" id="veil" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="modal">
      <h3 id="mTitle"></h3>
      <p class="how" id="mHow"></p>
      <div class="gclue" id="mClue"></div>
      <div id="mBody"></div>
      <div class="foot">
        <button class="btn" id="mOther">Try another game</button>
        <button class="btn solid" id="mClose">Close</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============ CROSSWORD DATA ============ */
const PUZZLE = {
  id: "pet-11",
  title: "Part 11",
  rows: 17, cols: 28,
  words: [
    {n:2,d:"A",r:0,c:13,a:"PURSUE",syl:["PUR","SUE"],clue:"Follow someone or something in order to catch or attack them.",syn:"chase, follow",ex:"The police had to ___ the thief through the busy market."},
    {n:3,d:"A",r:0,c:22,a:"PUSH",syl:["PUSH"],clue:"Exert force on someone or something, typically with one's hand, in order to move them away from oneself.",syn:"press, shove",ex:"The car stopped, so we had to get out and ___ it."},
    {n:5,d:"A",r:2,c:19,a:"PUBLICITY",syl:["PUB","LI","CI","TY"],clue:"The notice or attention given to someone or something by the media.",syn:"attention, promotion",ex:"The new film got a lot of ___ before it came out."},
    {n:6,d:"A",r:4,c:8,a:"QUICKLY",syl:["QUICK","LY"],clue:"At a fast speed.",syn:"fast, rapidly",ex:"She finished her homework ___ so she could go out and play."},
    {n:7,d:"A",r:4,c:16,a:"QUEEN",syl:["QUEEN"],clue:"The female ruler of an independent state, especially one who inherits the position by right of birth.",syn:"female monarch, king's wife",ex:"The ___ lived in a huge palace with her family."},
    {n:9,d:"A",r:6,c:1,a:"QUEUE",syl:["QUEUE"],clue:"A line or sequence of people or vehicles awaiting their turn to be attended to or to proceed.",syn:"line, row of people",ex:"The fans had to wait in a long ___ to buy tickets."},
    {n:10,d:"A",r:6,c:16,a:"PUBLISH",syl:["PUB","LISH"],clue:"Prepare and issue a book, journal, piece of music, or other work for public sale.",syn:"print, release",ex:"The company is going to ___ her first novel next year."},
    {n:11,d:"A",r:7,c:7,a:"PROPOSAL",syl:["PRO","PO","SAL"],clue:"A plan or suggestion, especially a formal or written one, put forward for consideration or discussion by others.",syn:"plan, suggestion",ex:"The students wrote a ___ for a longer lunch break."},
    {n:13,d:"A",r:9,c:2,a:"PROVIDE",syl:["PRO","VIDE"],clue:"Make available for use; supply.",syn:"give, supply",ex:"The hotel will ___ towels and soap for every guest."},
    {n:14,d:"A",r:10,c:12,a:"QUALITY",syl:["QUAL","I","TY"],clue:"The standard of something as measured against other things of a similar kind.",syn:"standard, level",ex:"These shoes are expensive, but the ___ is excellent."},
    {n:15,d:"A",r:11,c:0,a:"PROVE",syl:["PROVE"],clue:"Demonstrate the truth or existence of something by evidence or argument.",syn:"show, demonstrate",ex:"Can you ___ that you were at home last night?"},
    {n:16,d:"A",r:12,c:7,a:"PURCHASE",syl:["PUR","CHASE"],clue:"Acquire something by paying for it; buy.",syn:"buy, pay for",ex:"You can ___ tickets online or at the station."},
    {n:17,d:"A",r:14,c:6,a:"QUALIFICATION",syl:["QUAL","I","FI","CA","TION"],clue:"A quality or accomplishment that makes someone suitable for a particular job or activity.",syn:"certificate, diploma",ex:"You need a teaching ___ to work at this school."},
    {n:18,d:"A",r:16,c:8,a:"PUNISHMENT",syl:["PUN","ISH","MENT"],clue:"The infliction or imposition of a penalty as retribution for an offense.",syn:"penalty",ex:"As a ___ for being late, he had to clean the classroom."},
    {n:1,d:"D",r:0,c:10,a:"PUBLIC",syl:["PUB","LIC"],clue:"Of or concerning the people as a whole.",syn:"open to everyone, common",ex:"The new library is open to the ___ every day."},
    {n:2,d:"D",r:0,c:13,a:"PURELY",syl:["PURE","LY"],clue:"Entirely; exclusively.",syn:"only, simply",ex:"We met ___ by chance at the bus station."},
    {n:3,d:"D",r:0,c:22,a:"PULL",syl:["PULL"],clue:"Exert force on someone or something so as to cause movement toward oneself.",syn:"drag, tug",ex:"Hold the rope and ___ it as hard as you can!"},
    {n:4,d:"D",r:1,c:20,a:"QUANTITY",syl:["QUAN","TI","TY"],clue:"The amount or number of a material or immaterial thing not usually estimated by spatial measurement.",syn:"amount, number",ex:"The recipe only needs a small ___ of sugar."},
    {n:6,d:"D",r:4,c:8,a:"QUARREL",syl:["QUAR","REL"],clue:"An angry argument or disagreement, typically between people who are usually on good terms.",syn:"argument, fight",ex:"The two brothers had a ___ about who should wash the dishes."},
    {n:8,d:"D",r:5,c:4,a:"PURPOSE",syl:["PUR","POSE"],clue:"The reason for which something is done or created or for which something exists.",syn:"aim, reason",ex:"What is the ___ of your visit to London?"},
    {n:10,d:"D",r:6,c:16,a:"PUBLICATION",syl:["PUB","LI","CA","TION"],clue:"The action of making something generally known.",syn:"announcement, release",ex:"The ___ of the exam results will be next Monday."},
    {n:12,d:"D",r:7,c:10,a:"PROTECTION",syl:["PRO","TEC","TION"],clue:"The action of protecting someone or something, or the state of being protected.",syn:"safety, defence",ex:"Wear a hat for ___ from the sun."},
    {n:13,d:"D",r:9,c:2,a:"PROUDLY",syl:["PROUD","LY"],clue:"With feelings of deep pleasure or satisfaction in one's own achievements.",syn:"with pride",ex:"She ___ showed her parents her certificate."}
  ]
};
/* Decoy words for "Pick 1 of 4" */
const DECOYS = ["PRIZE","PROUD","PRINT","PRICE","QUIET","QUITE","QUOTE","QUICK","PURSE","PUPIL","PUZZLE","PROMISE","PRODUCE","PROGRAM","PROBLEM","PRIVATE","PRESENT","PREPARE","PRESSURE","PRACTICE","QUESTION","PRINCESS","POSITION","POLLUTION","PRODUCTION","PROMOTION","PREDICTION","PREPARATION","PRESENTATION","PUNCTUATION","PUBLISHER","POPULARITY","PERSONALITY","QUANTIFICATION","PURIFICATION","PUNCTUAL","PURPLE","PULSE","PUNCH","PUNISH","QUARTER","QUALIFY","QUANTUM","PROPERLY","PROBABLY","PRIMARY","PROJECT","PROTEST","PROVINCE","PUBLICLY","QUEUES","QUEST","QUAKE"];

/* ============ STATE ============ */
const W = PUZZLE.words.map((w,i)=>({...w,id:i,key:w.n+w.d}));
const KEY = "crossword-"+PUZZLE.id;
let state = {solved:{},peek:{},hints:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.solved) state=Object.assign(state,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

const cellsOf = w => [...w.a].map((ch,i)=>({r:w.r+(w.d==="D"?i:0),c:w.c+(w.d==="A"?i:0),ch}));
const solution = {};               // "r,c" -> letter
const startNum = {};               // "r,c" -> number
W.forEach(w=>{cellsOf(w).forEach(p=>solution[p.r+","+p.c]=p.ch); startNum[w.r+","+w.c]=w.n;});

let doneSeen = false;
let cur = null;                    // selected word
let lastGame = null;

const $ = id => document.getElementById(id);
const shuffle = a => {a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc = s => s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const dirName = d => d==="A"?"Across":"Down";

/* ============ NUMBER PICKER ============ */
function renderPicker(){
  ["A","D"].forEach(d=>{
    $("nums"+d).innerHTML = W.filter(w=>w.d===d).map(w=>
      `<button class="num ${state.solved[w.key]?"done":""}" data-id="${w.id}" aria-label="${w.n} ${dirName(w.d)}">${w.n}<span>${state.solved[w.key]?"solved":w.a.length+" letters"}</span></button>`).join("");
  });
  const k=Object.keys(state.solved).length;
  $("progText").textContent = k+" / "+W.length+" words";
  $("progBar").style.width = (k/W.length*100)+"%";
  if(k===W.length && !doneSeen){ doneSeen=true; $("doneAll").classList.add("show"); }
  if(k<W.length){ doneSeen=false; $("doneAll").classList.remove("show"); }
}
document.addEventListener("click",e=>{
  const b=e.target.closest(".num"); if(b) openWord(W[+b.dataset.id]);
});

/* ============ GRID ============ */
function knownLetter(k){
  // letter known at this square from a solved word
  for(const w of W){ if(!state.solved[w.key]) continue;
    for(const p of cellsOf(w)) if(p.r+","+p.c===k) return p.ch; }
  return null;
}
function renderGrid(){
  const g=$("grid");
  g.style.setProperty("--cols",PUZZLE.cols); g.style.setProperty("--rows",PUZZLE.rows);
  const selSet = cur? new Map(cellsOf(cur).map((p,i)=>[p.r+","+p.c,i])) : new Map();
  const typed = cur? $("ansInput").value.toUpperCase() : "";
  const peek = cur? (state.peek[cur.key]||[]) : [];
  let html="";
  for(let r=0;r<PUZZLE.rows;r++)for(let c=0;c<PUZZLE.cols;c++){
    const k=r+","+c;
    if(!solution[k]){html+=`<div></div>`;continue;}
    let cls="cell", txt="";
    const known=knownLetter(k);
    if(known){cls+=" solved known";txt=known;}
    if(selSet.has(k)){
      cls+=" sel"; const i=selSet.get(k);
      if(typed[i]) {txt=typed[i]; cls=cls.replace(" known","");}
      else if(!known && peek.includes(i)){txt=solution[k];cls+=" peek";}
    }
    html+=`<div class="${cls}" data-k="${k}">${startNum[k]?`<span class="n">${startNum[k]}</span>`:""}${txt}</div>`;
  }
  g.innerHTML=html;
  fitCells();
}
function fitCells(){
  const b=$("board");
  const w=b.clientWidth-36, h=b.clientHeight-36;
  const size=Math.max(16,Math.floor(Math.min(w/PUZZLE.cols,h/PUZZLE.rows)));
  document.documentElement.style.setProperty("--cell",size+"px");
}
addEventListener("resize",()=>{ if(cur) fitCells(); });

/* ============ OPEN A WORD ============ */
function openWord(w){
  cur=w;
  $("pickerView").hidden=true; $("playView").hidden=false;
  $("cNum").textContent=w.n; $("cDir").textContent=dirName(w.d);
  $("cLen").textContent=w.a.length+" letters";
  $("cClue").textContent=w.clue;
  const inp=$("ansInput"); inp.maxLength=w.a.length;
  const done=!!state.solved[w.key];
  inp.value=done?w.a:""; inp.disabled=done;
  $("msg").textContent=done?"This word is already solved.":""; $("msg").className="msg"+(done?" ok":"");
  $("hintBtn").disabled=done; $("revealBtn").disabled=done;
  renderUsed();
  renderGrid();
  scrollToWord();
  if(!done) inp.focus();
}
function scrollToWord(){
  const el=$("grid").querySelector(".cell.sel"); if(!el) return;

}
function renderUsed(){
  const u=state.hints[cur.key]||0;
  $("usedHints").textContent=u?`Hints used for this word: ${u}`:"";
}
$("ansInput").addEventListener("input",e=>{
  e.target.value=e.target.value.replace(/[^a-z]/gi,"").toUpperCase();
  $("msg").textContent=""; renderGrid();
});
$("ansForm").addEventListener("submit",e=>{
  e.preventDefault(); if(!cur||state.solved[cur.key]) return;
  const v=$("ansInput").value.toUpperCase();
  if(v.length<cur.a.length){ setMsg(`The word has ${cur.a.length} letters. You typed ${v.length}.`,"bad"); return; }
  if(v===cur.a) markSolved(cur,"Correct!");
  else setMsg("Not quite. Try again or press Hint.","bad");
});
function setMsg(t,kind){
  const m=$("msg"); m.textContent=t; m.className="msg "+(kind||"");
  if(kind==="bad"){const c=$("clueCard");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");}
}
function markSolved(w,text){
  state.solved[w.key]=1; save();
  if(cur===w){
    $("ansInput").value=w.a; $("ansInput").disabled=true;
    $("hintBtn").disabled=true; $("revealBtn").disabled=true;
    setMsg(text,"ok");
    renderGrid();
    cellsOf(w).forEach(p=>{const el=$("grid").querySelector(`[data-k="${p.r},${p.c}"]`); if(el){el.classList.remove("sel");el.classList.add("flash");}});
  }
  renderPicker();
}
$("backBtn").onclick=()=>{cur=null;$("playView").hidden=true;$("pickerView").hidden=false;renderPicker();};
$("revealBtn").onclick=()=>{ if(cur && confirm("Show the answer for this word?")) markSolved(cur,"Answer: "+cur.a); };
$("resetAll").onclick=()=>{ if(confirm("Clear all progress and start again?")){state={solved:{},peek:{},hints:{}};save();$("backBtn").onclick();} };

/* ============ HINTS / MINI GAMES ============ */
const GAMES = {
  reveal:{title:"Reveal a letter",how:"One random letter is now shown in the red squares (in a lighter colour)."},
  meaning:{title:"Similar words",how:"These words have a similar meaning to the answer."},
  example:{title:"Example sentence",how:"The answer fits in the gap in this sentence."},
  hangman:{title:"Hangman",how:"Guess one letter at a time. Six wrong guesses and the game is over."},
  anagram:{title:"Reorder the letters",how:"Tap the letters in the right order to build the word. Tap a letter in the top row to send it back."},
  syllable:{title:"Build the syllables",how:"The word is split into syllables. Tap them in the right order to build it."},
  choice:{title:"Pick 1 of 4",how:"Choose the word that matches the clue."},
  wordle:{title:"Wordle mini",how:"Guess the whole word. After each guess, the squares change colour."},
  noise:{title:"Find the right letters",how:"Some extra letters are mixed in. Choose the correct letters in the correct order."}
};
function availableGames(w){
  const peek=state.peek[w.key]||[];
  return Object.keys(GAMES).filter(g=>{
    if(g==="syllable") return w.syl.length>1;
    if(g==="reveal") return peek.length < w.a.length-1;   // always keep at least one letter hidden
    return true;
  });
}
function openHint(exclude){
  if(!cur||state.solved[cur.key]) return;
  let pool=availableGames(cur).filter(g=>g!==exclude&&g!==lastGame);
  if(!pool.length) pool=availableGames(cur);
  const g=pool[Math.floor(Math.random()*pool.length)];
  lastGame=g;
  curKeyHandler=null; document.removeEventListener("keydown",wordleKeys); $("mOther").hidden=false;
  state.hints[cur.key]=(state.hints[cur.key]||0)+1; save(); renderUsed();
  $("mTitle").textContent=GAMES[g].title;
  $("mHow").textContent=GAMES[g].how;
  $("mClue").innerHTML=`<b>${cur.n} ${dirName(cur.d)}</b> (${cur.a.length} letters): ${esc(cur.clue)}`;
  $("mBody").innerHTML="";
  RUN[g](cur,$("mBody"));
  $("veil").classList.add("open");
  setTimeout(()=>{const f=$("mBody").querySelector("button,input");(f||$("mClose")).focus();},50);
}
function closeHint(){ $("veil").classList.remove("open"); document.removeEventListener("keydown",wordleKeys); $("hintBtn").focus(); }
$("hintBtn").onclick=()=>openHint();
$("mOther").onclick=()=>{document.removeEventListener("keydown",wordleKeys);openHint(lastGame);};
$("mClose").onclick=closeHint;
$("veil").addEventListener("click",e=>{if(e.target===$("veil"))closeHint();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("veil").classList.contains("open"))closeHint();});

function gameWon(box,w){
  const d=document.createElement("div"); d.className="win";
  d.innerHTML=`Correct! The word is now in the crossword.<b>${w.a}</b>`;
  box.appendChild(d);
  markSolved(w,"Solved with a hint game!");
  $("mOther").hidden=true;
}

/* shared tile builder: anagram, syllables, letters with decoys */
function tileGame(box,w,pieces,targetCount){
  box.innerHTML=`<div class="slots" data-s></div><div class="tiles" data-t></div><div class="status" data-st></div>`;
  const slotsEl=box.querySelector("[data-s]"), tilesEl=box.querySelector("[data-t]"), st=box.querySelector("[data-st]");
  const tiles=pieces.map((p,i)=>({id:i,t:p}));
  let picked=[]; let over=false;
  const wide = pieces.some(p=>p.length>1);
  function draw(){
    let s="";
    for(let i=0;i<targetCount;i++){
      const p=picked[i];
      s+= p? `<button class="slot fill ${wide?"wide":""}" data-back="${i}">${p.t}</button>` : `<div class="slot empty ${wide?"wide":""}"></div>`;
    }
    slotsEl.innerHTML=s;
    tilesEl.innerHTML=tiles.map(t=>`<button class="tile ${picked.includes(t)?"gone":""}" data-tile="${t.id}">${t.t}</button>`).join("");
  }
  box.addEventListener("click",e=>{
    if(over) return;
    const t=e.target.closest("[data-tile]"), b=e.target.closest("[data-back]");
    if(t&&picked.length<targetCount){ picked.push(tiles[+t.dataset.tile]); }
    else if(b){ picked.splice(+b.dataset.back,1); }
    else return;
    st.textContent=""; st.className="status";
    draw();
    if(picked.length===targetCount){
      const word=picked.map(p=>p.t).join("");
      if(word===w.a){ over=true; gameWon(box,w); }
      else { st.textContent="Wrong order. Tap a letter in the top row to fix it."; st.className="status bad"; }
    }
  });
  draw();
}
function scramble(arr){ if(arr.length<2) return arr; let s; let n=0; do{s=shuffle(arr);n++}while(s.join("")===arr.join("")&&n<20); return s; }

const RUN = {
  reveal(w,box){
    const peek=state.peek[w.key]||(state.peek[w.key]=[]);
    const typed=$("ansInput").value.toUpperCase();
    let cand=[...w.a].map((_,i)=>i).filter(i=>!peek.includes(i));
    const notTyped=cand.filter(i=>typed[i]!==w.a[i]); if(notTyped.length) cand=notTyped;
    const i=cand[Math.floor(Math.random()*cand.length)];
    peek.push(i); save();
    // clear a wrong typed letter here so the hint letter shows
    if(typed[i] && typed[i]!==w.a[i]){ $("ansInput").value=typed.slice(0,i); }
    renderGrid();
    const shown=[...w.a].map((ch,k)=>peek.includes(k)?ch:"_").join(" ");
    box.innerHTML=`<p class="big">Letter <b>${i+1}</b> is <b>${w.a[i]}</b>.</p><div class="slots">${[...w.a].map((ch,k)=>`<div class="slot ${peek.includes(k)?"":"empty"}">${peek.includes(k)?ch:""}</div>`).join("")}</div><p class="how" style="text-align:center">${peek.length} of ${w.a.length} letters shown. Press Hint again for more help.</p>`;
  },
  meaning(w,box){
    box.innerHTML=`<p class="big">Similar words: <b>${esc(w.syn)}</b></p><p class="how">The answer starts with <b>${w.a[0]}</b> and has ${w.a.length} letters.</p>`;
  },
  example(w,box){
    box.innerHTML=`<p class="big">${esc(w.ex).replace("___",'<span class="blank"></span>')}</p><p class="how">Fill in the missing word (${w.a.length} letters).</p>`;
  },
  hangman(w,box){
    const MAX=6; let wrong=0, guessed=new Set(), over=false;
    box.innerHTML=`<div class="lives" data-l></div><div class="slots" data-s></div><div class="keys" data-k></div><div class="status" data-st></div>`;
    const L=box.querySelector("[data-l]"),S=box.querySelector("[data-s]"),K=box.querySelector("[data-k]"),st=box.querySelector("[data-st]");
    K.innerHTML=[..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"].map(ch=>`<button class="key" data-ch="${ch}">${ch}</button>`).join("");
    function draw(lose){
      L.innerHTML=Array.from({length:MAX},(_,i)=>`<i class="${i<wrong?"lost":""}"></i>`).join("");
      S.innerHTML=[...w.a].map(ch=>`<div class="slot ${guessed.has(ch)?"":(lose?"miss":"empty")}">${guessed.has(ch)||lose?ch:""}</div>`).join("");
    }
    function guess(ch){
      if(over||guessed.has(ch)) return;
      guessed.add(ch);
      const btn=K.querySelector(`[data-ch="${ch}"]`); btn.disabled=true;
      if(w.a.includes(ch)) btn.classList.add("hit"); else {btn.classList.add("no"); wrong++;}
      if([...w.a].every(c=>guessed.has(c))){ over=true; draw(); gameWon(box,w); return; }
      if(wrong>=MAX){ over=true; draw(true); st.className="status bad"; st.textContent=`Out of guesses! The word was ${w.a}. Now type it into the answer box.`; return; }
      st.textContent=`Wrong guesses left: ${MAX-wrong}`; st.className="status";
      draw();
    }
    K.addEventListener("click",e=>{const b=e.target.closest("[data-ch]"); if(b) guess(b.dataset.ch);});
    hangKeys=e=>{ if(/^[a-z]$/i.test(e.key)&&$("veil").classList.contains("open")) guess(e.key.toUpperCase()); };
    draw(); st.textContent=`Wrong guesses left: ${MAX}`;
    document.addEventListener("keydown",wordleKeys);
    curKeyHandler=hangKeys;
  },
  anagram(w,box){ tileGame(box,w,scramble([...w.a]),w.a.length); },
  syllable(w,box){ tileGame(box,w,scramble(w.syl),w.syl.length); },
  noise(w,box){
    const alpha="ABCDEFGHIJKLMNOPRSTUVWY";
    const extra=Math.min(5,Math.max(3,Math.round(w.a.length/2)));
    const noise=Array.from({length:extra},()=>alpha[Math.floor(Math.random()*alpha.length)]);
    tileGame(box,w,shuffle([...w.a,...noise]),w.a.length);
  },
  choice(w,box){
    const answers=W.map(x=>x.a);
    const pool=[...new Set([...answers,...DECOYS])].filter(x=>x!==w.a);
    const score=x=>Math.abs(x.length-w.a.length)*2 + (x[0]===w.a[0]?0:1) + (x.slice(0,2)===w.a.slice(0,2)?0:1) + Math.random()*1.5;
    const opts=shuffle([w.a,...pool.sort((a,b)=>score(a)-score(b)).slice(0,3)]);
    box.innerHTML=`<div class="choices">${opts.map(o=>`<button class="choice" data-o="${o}">${o}</button>`).join("")}</div><div class="status" data-st></div>`;
    const st=box.querySelector("[data-st]"); let over=false;
    box.querySelector(".choices").addEventListener("click",e=>{
      const b=e.target.closest("[data-o]"); if(!b||over||b.disabled) return;
      if(b.dataset.o===w.a){ over=true; b.classList.add("right"); st.textContent=""; gameWon(box,w); }
      else { b.classList.add("wrong"); b.disabled=true; st.className="status bad"; st.textContent="Not this one. Try again."; }
    });
  },
  wordle(w,box){
    const MAX=6, N=w.a.length; let rows=[], cur="", over=false;
    const avail=(box.clientWidth||1000);
    const size=Math.max(16,Math.min(46,Math.floor((avail-(N-1)*5)/N)));
    box.innerHTML=`<div class="legend"><b style="background:var(--ok)">green</b> right place &nbsp; <b style="background:var(--warn)">yellow</b> in the word, wrong place &nbsp; <b style="background:var(--hint)">grey</b> not in the word</div><div class="wgrid" data-g style="--wc:${size}px"></div><div class="keys k15" data-k></div><div class="status" data-st></div>`;
    const G=box.querySelector("[data-g]"),K=box.querySelector("[data-k]"),st=box.querySelector("[data-st]");
    const keyState={};
    function score(g){
      const res=Array(N).fill("x"), left={};
      for(let i=0;i<N;i++){ if(g[i]===w.a[i]) res[i]="g"; else left[w.a[i]]=(left[w.a[i]]||0)+1; }
      for(let i=0;i<N;i++){ if(res[i]!=="g" && left[g[i]]>0){ res[i]="y"; left[g[i]]--; } }
      return res;
    }
    function draw(){
      let h="";
      for(let r=0;r<MAX;r++){
        h+=`<div class="wrow">`;
        for(let i=0;i<N;i++){
          if(r<rows.length){ h+=`<div class="wc ${rows[r].s[i]}">${rows[r].g[i]}</div>`; }
          else if(r===rows.length && !over){ h+=`<div class="wc ${cur[i]?"typed":""}">${cur[i]||""}</div>`; }
          else h+=`<div class="wc"></div>`;
        }
        h+=`</div>`;
      }
      G.innerHTML=h;
      const cls={g:"hit",y:"part",x:"no"};
      K.innerHTML=[..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"].map(ch=>`<button class="key ${keyState[ch]?cls[keyState[ch]]:""}" data-ch="${ch}">${ch}</button>`).join("")+
        `<button class="key wide" data-act="del">Delete</button><button class="key wide" data-act="enter">Enter</button>`;
    }
    function press(k){
      if(over) return;
      if(k==="del"){ cur=cur.slice(0,-1); }
      else if(k==="enter"){
        if(cur.length<N){ st.className="status bad"; st.textContent=`The word needs ${N} letters.`; return; }
        const s=score(cur); rows.push({g:cur,s});
        [...cur].forEach((ch,i)=>{ const rank={g:3,y:2,x:1}; if(!keyState[ch]||rank[s[i]]>rank[keyState[ch]]) keyState[ch]=s[i]; });
        if(cur===w.a){ over=true; cur=""; draw(); st.textContent=""; gameWon(box,w); return; }
        cur="";
        if(rows.length>=MAX){ over=true; draw(); st.className="status bad"; st.textContent=`Out of guesses! The word was ${w.a}.`; return; }
        st.className="status"; st.textContent=`Guesses left: ${MAX-rows.length}`;
      }
      else if(cur.length<N){ cur+=k; }
      st.textContent= st.className.includes("bad")? "" : st.textContent; st.className="status";
      draw();
    }
    K.addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return; press(b.dataset.act||b.dataset.ch);});
    curKeyHandler=e=>{
      if(!$("veil").classList.contains("open")) return;
      if(/^[a-z]$/i.test(e.key)) press(e.key.toUpperCase());
      else if(e.key==="Backspace") press("del");
      else if(e.key==="Enter"){ e.preventDefault(); press("enter"); }
    };
    document.addEventListener("keydown",wordleKeys);
    draw(); st.textContent=`You have ${MAX} guesses.`;
  }
};
/* physical keyboard for Hangman / Wordle */
let curKeyHandler=null, hangKeys=null;
function wordleKeys(e){ if(curKeyHandler) curKeyHandler(e); }
const _close=closeHint;

/* 16:9 scaling and full screen */
function fitStage(){
  const st=$("stage"), k=Math.min(innerWidth/1600, innerHeight/900);
  st.style.transform=`scale(${k})`;
  st.style.left=((innerWidth-1600*k)/2)+"px";
  st.style.top=((innerHeight-900*k)/2)+"px";
}
addEventListener("resize",fitStage); fitStage();
$("doneBack").onclick=()=>$("doneAll").classList.remove("show");
document.addEventListener("keydown",e=>{
  const typing=/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if((e.key==="f"||e.key==="F") && !typing && !$("veil").classList.contains("open") && !e.ctrlKey && !e.metaKey){
    if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.();
  }
});

renderPicker();
</script>
